<!-- @dsCard group="Components" viewport="700x200" name="Forms" subtitle="Field states, including error and disabled" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:18px}</style>
</head>
<body>
<div id="root"></div>
<script>function ds(){var n=[].slice.call(arguments);for(var k in window){try{var v=window[k];if(v&&typeof v==='object'&&n.every(function(x){return typeof v[x]==='function'}))return v}catch(e){}}return {}}</script>
<script type="text/babel">
const { Field } = ds('Field');
ReactDOM.createRoot(document.getElementById('root')).render(
  <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:16}}>
    <Field id="c1" label="Default" placeholder="you@company.com" helper="Helper text sits here." />
    <Field id="c2" label="Filled" value="mikaelrsimoes19@gmail.com" helper="Value in full ink." />
    <Field id="c3" label="Error" value="not-an-email" error="Enter a valid address." />
    <Field id="c4" label="Disabled" value="locked" disabled helper="Sunken ground, muted ink." />
  </div>
);
</script>
</body>
</html>
