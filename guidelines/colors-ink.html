<!-- @dsCard group="Colors" viewport="700x110" name="Ink scale" subtitle="Four text weights, dark theme" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>body{padding:16px;font-family:var(--font-body)}
.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:0.06em;color:var(--faint);margin-top:6px}
.sw{height:44px;border:1px solid var(--rule)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:10px}
</style>
</head>
<body>
<div class="row"><div><div class="sw" style="background:#FFFFFF"></div><div class="lbl" style="color:var(--ink-soft)">Ink</div><div class="lbl">#FFFFFF</div></div><div><div class="sw" style="background:#D4D4D4"></div><div class="lbl" style="color:var(--ink-soft)">Ink soft</div><div class="lbl">#D4D4D4</div></div><div><div class="sw" style="background:#A1A1A1"></div><div class="lbl" style="color:var(--ink-soft)">Muted</div><div class="lbl">#A1A1A1</div></div><div><div class="sw" style="background:#8F8F8F"></div><div class="lbl" style="color:var(--ink-soft)">Faint</div><div class="lbl">#8F8F8F</div></div><div><div class="sw" style="background:#2E2E2E"></div><div class="lbl" style="color:var(--ink-soft)">Rule</div><div class="lbl">#2E2E2E</div></div></div>
</body>
</html>
