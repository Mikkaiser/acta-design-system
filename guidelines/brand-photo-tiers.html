<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>body{padding:16px;font-family:var(--font-body)}
.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:0.06em;color:var(--faint);margin-top:6px}
.sw{height:44px;border:1px solid var(--rule)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:10px}
</style>
</head>
<body>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start">
    <div>
      <div data-photo="data-photo" style="position:relative;width:96px;height:96px;border-radius:50%;overflow:hidden"><img src="../assets/burj-view.jpg" alt="" style="position:absolute;width:248%;height:auto;left:-121%;top:-36%;display:block" /></div>
      <div class="lbl">CHROME · GRAYSCALE<br />COLOUR ON HOVER</div>
    </div>
    <div>
      <div style="border:1px solid var(--rule);padding:6px"><img src="../assets/worldskills-lyon-2024.jpg" alt="" style="display:block;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:50% 22%" /></div>
      <div class="lbl">EVIDENCE · FULL COLOUR<br />FRAMED, CAPTIONED</div>
    </div>
    <div>
      <img data-photo="data-photo" src="../assets/burj-view.jpg" alt="" style="display:block;width:100%;aspect-ratio:3/4;object-fit:cover" />
      <div class="lbl">MOOD · GRAYSCALE<br />NO FRAME, NO CAPTION</div>
    </div>
  </div>
</body>
</html>
