<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>body{padding:16px;font-family:var(--font-body)}
.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:0.06em;color:var(--faint);margin-top:6px}
.sw{height:44px;border:1px solid var(--rule)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:10px}
</style>
</head>
<body>
<div class="row"><div><div class="sw" style="background:#0A0A0A"></div><div class="lbl" style="color:var(--ink-soft)">Ground</div><div class="lbl">#0A0A0A</div></div><div><div class="sw" style="background:#171717"></div><div class="lbl" style="color:var(--ink-soft)">Raised</div><div class="lbl">#171717</div></div><div><div class="sw" style="background:#1F1F1F"></div><div class="lbl" style="color:var(--ink-soft)">Sunken</div><div class="lbl">#1F1F1F</div></div><div><div class="sw" style="background:#FFFFFF"></div><div class="lbl" style="color:var(--ink-soft)">Ground</div><div class="lbl">#FFFFFF</div></div><div><div class="sw" style="background:#FAFAFA"></div><div class="lbl" style="color:var(--ink-soft)">Raised</div><div class="lbl">#FAFAFA</div></div><div><div class="sw" style="background:#F5F5F5"></div><div class="lbl" style="color:var(--ink-soft)">Sunken</div><div class="lbl">#F5F5F5</div></div></div>
</body>
</html>
