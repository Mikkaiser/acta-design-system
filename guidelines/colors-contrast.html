<!-- @dsCard group="Colors" viewport="700x150" name="Contrast floor" subtitle="Every pair clears AA in both themes" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>body{padding:16px;font-family:var(--font-body)}
.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:0.06em;color:var(--faint);margin-top:6px}
.sw{height:44px;border:1px solid var(--rule)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:10px}
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:7px">
  <div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline"><span style="font-size:13px;color:var(--ink)">Ink on ground</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums">19.8 / 21.0</span></div><div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline"><span style="font-size:13px;color:var(--ink-soft)">Ink soft on ground</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums">13.8 / 10.4</span></div><div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline"><span style="font-size:13px;color:var(--muted)">Muted on ground</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums">7.8 / 7.4</span></div><div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline"><span style="font-size:13px;color:var(--faint)">Faint on ground</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums">6.1 / 4.7</span></div>
  <div style="font-family:var(--font-mono);font-size:10px;color:var(--faint);letter-spacing:0.06em;margin-top:4px">DARK / LIGHT · FAINT AT 10–11px IS THE FLOOR</div>
  </div>
</body>
</html>
