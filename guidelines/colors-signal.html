<!-- @dsCard group="Colors" viewport="700x110" name="Signal" subtitle="Field errors only, nothing else is coloured" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>body{padding:16px;font-family:var(--font-body)}
.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:0.06em;color:var(--faint);margin-top:6px}
.sw{height:44px;border:1px solid var(--rule)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:10px}
</style>
</head>
<body>
<div class="row"><div><div class="sw" style="background:#FF6166"></div><div class="lbl" style="color:var(--ink-soft)">Signal dark</div><div class="lbl">#FF6166</div></div><div><div class="sw" style="background:#CC0000"></div><div class="lbl" style="color:var(--ink-soft)">Signal light</div><div class="lbl">#CC0000</div></div></div>
</body>
</html>
