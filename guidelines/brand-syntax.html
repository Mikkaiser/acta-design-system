<!-- @dsCard group="Brand" viewport="700x150" name="Syntax tokens" subtitle="Dracula, six roles" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>body{padding:16px;font-family:var(--font-body)}
.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:0.06em;color:var(--faint);margin-top:6px}
.sw{height:44px;border:1px solid var(--rule)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:10px}
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:7px">
  <div style="display:flex;align-items:baseline;gap:10px"><span style="width:11px;height:11px;background:#FF79C6;border-radius:2px;flex:0 0 auto"></span><span style="font-family:var(--font-mono);font-size:11px;color:var(--muted)">#FF79C6</span><span style="font-size:12px;color:var(--muted)">Keyword, operator</span></div><div style="display:flex;align-items:baseline;gap:10px"><span style="width:11px;height:11px;background:#8BE9FD;border-radius:2px;flex:0 0 auto"></span><span style="font-family:var(--font-mono);font-size:11px;color:var(--muted)">#8BE9FD</span><span style="font-size:12px;color:var(--muted)">Type, class</span></div><div style="display:flex;align-items:baseline;gap:10px"><span style="width:11px;height:11px;background:#50FA7B;border-radius:2px;flex:0 0 auto"></span><span style="font-family:var(--font-mono);font-size:11px;color:var(--muted)">#50FA7B</span><span style="font-size:12px;color:var(--muted)">Function, method</span></div><div style="display:flex;align-items:baseline;gap:10px"><span style="width:11px;height:11px;background:#FFB86C;border-radius:2px;flex:0 0 auto"></span><span style="font-family:var(--font-mono);font-size:11px;color:var(--muted)">#FFB86C</span><span style="font-size:12px;color:var(--muted)">Parameter, italic</span></div><div style="display:flex;align-items:baseline;gap:10px"><span style="width:11px;height:11px;background:#BD93F9;border-radius:2px;flex:0 0 auto"></span><span style="font-family:var(--font-mono);font-size:11px;color:var(--muted)">#BD93F9</span><span style="font-size:12px;color:var(--muted)">Number, string</span></div><div style="display:flex;align-items:baseline;gap:10px"><span style="width:11px;height:11px;background:#6272A4;border-radius:2px;flex:0 0 auto"></span><span style="font-family:var(--font-mono);font-size:11px;color:var(--muted)">#6272A4</span><span style="font-size:12px;color:var(--muted)">Comment</span></div>
  </div>
</body>
</html>
