<!-- @dsCard group="Spacing" viewport="700x160" name="Rules and radii" subtitle="Two weights, four radii, no shadows" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>body{padding:16px;font-family:var(--font-body)}
.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:0.06em;color:var(--faint);margin-top:6px}
.sw{height:44px;border:1px solid var(--rule)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:10px}
</style>
</head>
<body>
<div style="height:1px;background:var(--ink);margin-bottom:6px"></div><div class="lbl">1px INK · UNDER A SECTION HEAD</div>
   <div style="height:1px;background:var(--rule);margin:14px 0 6px"></div><div class="lbl">1px RULE · BETWEEN ROWS IN A SET</div>
   <div style="display:flex;gap:10px;align-items:center;margin-top:16px">
     <div style="width:44px;height:30px;border:1px solid var(--rule)"></div>
     <div style="width:44px;height:30px;border:1px solid var(--rule);border-radius:4px"></div>
     <div style="width:44px;height:30px;border:1px solid var(--rule);border-radius:12px"></div>
     <div style="width:30px;height:30px;border:1px solid var(--rule);border-radius:50%"></div>
     <span style="font-family:var(--font-mono);font-size:10px;color:var(--faint);letter-spacing:0.06em">0 · 4 · 12 · 50%</span>
   </div>
</body>
</html>
